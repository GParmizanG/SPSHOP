<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Product Management — SPSHOP</title>
</head>
<body>
	<section>
		<div class="container py-5">
			<div class="glass-card p-4">
				<div class="d-flex justify-content-between align-items-center mb-4">
					<h2 class="fw-bold text-white mb-0">
						<i class="fa-solid fa-boxes-stacked me-2" style="color:#daa520;"></i> Products
					</h2>
					<a th:href="@{'/admin/add-product'}" class="btn btn-premium px-4">
						<i class="fa-solid fa-plus me-1"></i> Add Product
					</a>
				</div>

				<!-- Notification Fallback -->
				<div th:if="${session.successMsg}" class="alert bg-success-subtle text-success border-0 mb-4 py-3" style="border-radius: 16px;">
					<i class="fa-solid fa-circle-check me-2"></i> [[${session.successMsg}]]
					<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
				</div>
				<div th:if="${session.errorMsg}" class="alert bg-danger-subtle text-danger border-0 mb-4 py-3" style="border-radius: 16px;">
					<i class="fa-solid fa-circle-exclamation me-2"></i> [[${session.errorMsg}]]
					<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
				</div>


				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0" style="color: rgba(255,255,255,0.85);">
						<thead style="border-bottom: 1px solid rgba(255,255,255,0.1);">
							<tr>
								<th class="py-3">SL</th>
								<th class="py-3">Image</th>
								<th class="py-3">Title</th>
								<th class="py-3">Category</th>
								<th class="py-3">Price</th>
								<th class="py-3">Stock</th>
								<th class="py-3">Status</th>
								<th class="py-3">Actions</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="product, count : ${productList}" style="border-bottom: 1px solid rgba(255,255,255,0.05);">
								<td class="py-3">[[${count.count}]]</td>
								<td class="py-3">
									<img th:src="@{'/img/product_image/'+${product.productImage}}" 
										 class="rounded-3 shadow-sm" 
										 style="width: 50px; height: 50px; object-fit: cover; border: 1px solid rgba(255,255,255,0.1);">
								</td>
								<td class="py-3 fw-medium text-white">[[${product.productTitle}]]</td>
								<td class="py-3 text-white-50">[[${product.productCategory}]]</td>
								<td class="py-3 fw-semibold">&euro;[[${product.discountPrice}]]</td>
								<td class="py-3">
									<span th:class="${product.productStock > 10 ? 'text-white' : 'text-warning fw-bold'}">
										[[${product.productStock}]]
									</span>
								</td>
								<td class="py-3">
									<span th:if="${product.isActive}" class="badge bg-success-subtle text-success rounded-pill px-3 py-2">Active</span>
									<span th:unless="${product.isActive}" class="badge bg-danger-subtle text-danger rounded-pill px-3 py-2">Inactive</span>
								</td>
								<td class="py-3">
									<div class="btn-group btn-group-sm">
										<a th:href="@{'/admin/edit-product/'+${product.id}}" class="btn btn-outline-warning">
											<i class="fa-solid fa-pen-to-square"></i>
										</a>
										<button class="btn btn-outline-danger" th:onclick="'deleteProduct(' + ${product.id} + ')'">
											<i class="fa-solid fa-trash"></i>
										</button>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>

		<script>
			function deleteProduct(id) {
				Swal.fire({
					title: 'Are you sure?',
					text: "This product will be removed!",
					icon: 'warning',
					showCancelButton: true,
					confirmButtonColor: '#dc3545',
					cancelButtonColor: '#6c757d',
					confirmButtonText: 'Yes, delete it!',
					background: '#0a1226',
					color: '#fff',
					customClass: { popup: 'glass-card border-0 shadow-lg' }
				}).then((result) => {
					if (result.isConfirmed) {
						window.location.href = '/admin/delete-product/' + id;
					}
				})
			}
		</script>

		<style>
			.table { --bs-table-bg: transparent; }
			.badge { font-weight: 600; font-size: 0.75rem; letter-spacing: 0.02em; }
			.bg-success-subtle { background-color: rgba(25, 135, 84, 0.15) !important; }
			.bg-danger-subtle { background-color: rgba(220, 53, 69, 0.15) !important; }
			.btn-outline-warning { color: #daa520; border-color: rgba(218, 165, 32, 0.3); }
			.btn-outline-warning:hover { background-color: #daa520; color: #000; }
			.btn-outline-danger { color: #dc3545; border-color: rgba(220, 53, 69, 0.3); }
		</style>
	</section>
</body>
</html>
