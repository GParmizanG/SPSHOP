<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>SPSHOP | Register</title>
</head>
<body>
	<section>
		<div class="container mt-5 mb-5">
			<div class="row justify-content-center">
				<div class="col-md-7 col-lg-6">
					<div class="glass-card p-5 shadow-lg border-0" style="border-radius: 30px; background: rgba(10, 20, 40, 0.7) !important;">
						<div class="text-center mb-4">
							<div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px; background: rgba(218, 165, 32, 0.1); border-radius: 20px;">
								<i class="fa-solid fa-user-plus" style="font-size: 2rem; color: #daa520;"></i>
							</div>
							<h3 class="fw-bold text-white mb-1" style="letter-spacing: -0.02em;">Create Account</h3>
							<p class="text-white-50 small">Join the community and start your journey</p>
						</div>

						<!-- Alerts from Session -->
						<th:block th:if="${session.successMsg}">
							<div class="alert alert-success border-0 small py-2 mb-4 text-center" style="border-radius: 12px; background: rgba(40, 167, 69, 0.1); color: #51cf66;">
								<span th:text="${session.successMsg}"></span>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</div>
						</th:block>
						<th:block th:if="${session.errorMsg}">
							<div class="alert alert-danger border-0 small py-2 mb-4 text-center" style="border-radius: 12px; background: rgba(220, 53, 69, 0.1); color: #ff6b6b;">
								<span th:text="${session.errorMsg}"></span>
								<th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
							</div>
						</th:block>

						<form action="/save-user" method="post" enctype="multipart/form-data" id="registerForm" onsubmit="return validateForm()">
							<div class="row">
								<div class="col-md-6 mb-4">
									<label class="form-label text-white-50 small fw-bold ps-2">Full Name</label>
									<input type="text" name="name" class="form-control border-0 py-3" placeholder="John Doe" required 
										style="background: rgba(255,255,255,0.05); color: #fff; border-radius: 16px;">
								</div>
								<div class="col-md-6 mb-4">
									<label class="form-label text-white-50 small fw-bold ps-2">Mobile Number</label>
									<input type="text" name="mobile" class="form-control border-0 py-3" placeholder="+1 234 567 89" required 
										style="background: rgba(255,255,255,0.05); color: #fff; border-radius: 16px;">
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label text-white-50 small fw-bold ps-2">Email Address</label>
								<input type="email" name="email" class="form-control border-0 py-3" placeholder="name@example.com" required 
									style="background: rgba(255,255,255,0.05); color: #fff; border-radius: 16px;">
							</div>

							<div class="row">
								<div class="col-md-6 mb-4">
									<label class="form-label text-white-50 small fw-bold ps-2">Password</label>
									<div class="input-group">
										<input type="password" name="password" id="password" class="form-control border-0 py-3" placeholder="••••••••" required 
											style="background: rgba(255,255,255,0.05); color: #fff; border-radius: 16px 0 0 16px; border-right: none;">
										<span class="input-group-text border-0" style="background: rgba(255,255,255,0.05); border-radius: 0 16px 16px 0; color: #daa520; cursor: pointer;" onclick="togglePassword('password', this)">
											<i class="fa-solid fa-eye"></i>
										</span>
									</div>
								</div>
								<div class="col-md-6 mb-4">
									<label class="form-label text-white-50 small fw-bold ps-2">Confirm Password</label>
									<div class="input-group">
										<input type="password" id="confirmPassword" class="form-control border-0 py-3" placeholder="••••••••" required 
											style="background: rgba(255,255,255,0.05); color: #fff; border-radius: 16px 0 0 16px; border-right: none;">
										<span class="input-group-text border-0" style="background: rgba(255,255,255,0.05); border-radius: 0 16px 16px 0; color: #daa520; cursor: pointer;" onclick="togglePassword('confirmPassword', this)">
											<i class="fa-solid fa-eye"></i>
										</span>
									</div>
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label text-white-50 small fw-bold ps-2">Profile Image</label>
								<input type="file" name="file" class="form-control border-0 py-2" 
									style="background: rgba(255,255,255,0.05); color: #fff; border-radius: 16px;">
							</div>

							<button type="submit" class="btn w-100 py-3 fw-bold mt-2 shadow-sm" 
								style="background: #daa520; color: #000; border-radius: 16px; transition: all 0.3s ease;">
								Create Account <i class="fa-solid fa-user-check ms-2"></i>
							</button>

							<div class="text-center mt-4">
								<p class="text-white-50 small mb-1">Already have an account? 
									<a href="/signin" class="text-decoration-none ms-1" style="color: #daa520; font-weight: 700;">Sign In</a>
								</p>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>

		<script>
			function togglePassword(inputId, iconEl) {
				const input = document.getElementById(inputId);
				const icon = iconEl.querySelector('i');
				if (input.type === 'password') {
					input.type = 'text';
					icon.classList.remove('fa-eye');
					icon.classList.add('fa-eye-slash');
				} else {
					input.type = 'password';
					icon.classList.remove('fa-eye-slash');
					icon.classList.add('fa-eye');
				}
			}

			function validateForm() {
				const password = document.getElementById('password').value;
				const confirmPassword = document.getElementById('confirmPassword').value;
				
				// Strength check: min 8 chars, at least one special symbol
				const regex = /^(?=.*[^a-zA-Z0-9]).{8,}$/;
				
				if (!regex.test(password)) {
					Toast.fire({ 
						icon: 'error', 
						title: 'Weak Password! Must be at least 8 characters long and contain one special symbol.' 
					});
					return false;
				}

				if (password !== confirmPassword) {
					Toast.fire({ 
						icon: 'error', 
						title: 'Passwords do not match!' 
					});
					return false;
				}
				return true;
			}
		</script>
		
		<style>
			input::placeholder {
				color: rgba(255,255,255,0.2) !important;
			}
			.form-control:focus {
				background: rgba(255,255,255,0.08) !important;
				color: #fff !important;
				box-shadow: 0 0 0 2px rgba(218, 165, 32, 0.2) !important;
			}
			.btn:hover {
				background: #fff !important;
				color: #daa520 !important;
				transform: translateY(-2px);
				box-shadow: 0 8px 25px rgba(218, 165, 32, 0.4) !important;
			}
			input[type="file"]::file-selector-button {
				background: rgba(218, 165, 32, 0.2);
				color: #daa520;
				border: none;
				border-radius: 8px;
				padding: 4px 12px;
				margin-right: 15px;
				font-weight: 600;
				cursor: pointer;
			}
		</style>
	</section>
</body>
</html>
