<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container" style="margin-top: 60px; margin-bottom: 90px;">
			<div class="mb-4">
				<a href="/products" class="btn btn-premium-outline">
					<i class="fa-solid fa-arrow-left me-2"></i> Back to Products
				</a>
			</div>
			<div class="glass-card p-4 p-md-5">
				<div class="row g-5">
					<!-- Product Image -->
					<div class="col-md-6">
						<div class="product-view-frame shadow-lg">
							<img alt="product_image" th:src="@{'/product-img/'+${product.id}}"
								class="product-view-img">
						</div>
					</div>

					<!-- Product Info -->
					<div class="col-md-6">
						<div class="d-flex flex-column h-100">
							<nav aria-label="breadcrumb" class="mb-3">
								<ol class="breadcrumb" style="background: transparent; padding: 0;">
									<li class="breadcrumb-item"><a href="/" style="color: rgba(255,255,255,0.5); text-decoration: none;">Home</a></li>
									<li class="breadcrumb-item"><a href="/products" style="color: rgba(255,255,255,0.5); text-decoration: none;">Products</a></li>
									<li class="breadcrumb-item active" style="color: #daa520;" th:text="${product.productCategory}">Category</li>
								</ol>
							</nav>

							<h1 class="display-5 fw-bold mb-3" style="letter-spacing: -0.02em;" th:text="${product.productTitle}">Product Title</h1>
							
							<div class="mb-4">
								<p class="text-white mb-2" style="font-size: 1.1rem; line-height: 1.6; opacity: 0.8;" th:text="${product.productDescription}">Description</p>
							</div>

							<div class="mb-4">
								<div class="d-flex align-items-center gap-3 mb-2">
									<span class="fs-2 fw-bold text-white">&euro;<span th:text="${product.discountPrice}"></span></span>
									<span th:if="${product.discount > 0}" class="fs-5 text-decoration-line-through" style="color: rgba(255,255,255,0.4);">&euro;<span th:text="${product.productPrice}"></span></span>
									<span th:if="${product.discount > 0}" class="badge bg-success" style="padding: 6px 12px; border-radius: 8px;"><span th:text="${product.discount}"></span>% OFF</span>
								</div>
								<div class="d-flex align-items-center gap-2">
									<span th:if="${product.productStock > 0}" class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2" style="border-radius: 20px;">
										<i class="fa-solid fa-check-circle me-1"></i> In Stock
									</span>
									<span th:unless="${product.productStock > 0}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-2" style="border-radius: 20px;">
										<i class="fa-solid fa-xmark-circle me-1"></i> Out of Stock
									</span>
								</div>
							</div>

							<hr style="border-color: rgba(255,255,255,0.1); margin: 2rem 0;">

							<!-- Features -->
							<div class="row g-4 mb-5">
								<div class="col-6">
									<div class="text-center p-3 rounded-4" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);">
										<div class="mb-2" style="color: #daa520; font-size: 1.5rem;"><i class="fas fa-undo-alt"></i></div>
										<p class="small mb-0 text-white-50">7 Day Returns</p>
									</div>
								</div>
								<div class="col-6">
									<div class="text-center p-3 rounded-4" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);">
										<div class="mb-2" style="color: #daa520; font-size: 1.5rem;"><i class="fas fa-truck-moving"></i></div>
										<p class="small mb-0 text-white-50">Free Shipping</p>
									</div>
								</div>
							</div>

							<div class="mt-auto">
								<th:block th:if="${product.productStock > 0}">
									<th:block th:if="${currentLoggedInUserDetails==null}">
										<a href="/signin" class="btn btn-primary w-100 py-3 fw-bold" style="background: #daa520; border: none; color: #000; border-radius: 16px;">
											<i class="fa-solid fa-cart-shopping me-2"></i> Add To Cart
										</a>
									</th:block>
									<th:block th:if="${currentLoggedInUserDetails != null && currentLoggedInUserDetails.role == 'ROLE_USER'}">
										<button th:data-id="${product.id}" 
										   class="btn btn-primary w-100 py-3 fw-bold add-to-cart-btn" style="background: #daa520; border: none; color: #000; border-radius: 16px;">
											<i class="fa-solid fa-cart-shopping me-2"></i> Add To Cart
										</button>
									</th:block>
									<th:block th:if="${currentLoggedInUserDetails != null && currentLoggedInUserDetails.role == 'ROLE_ADMIN'}">
										<div class="alert bg-warning-subtle text-warning border-0 small text-center" style="border-radius: 12px;">
											<i class="fa-solid fa-circle-info me-2"></i> Admin accounts cannot purchase items.
										</div>
									</th:block>
								</th:block>
								<th:block th:unless="${product.productStock > 0}">
									<button class="btn btn-secondary w-100 py-3 fw-bold" disabled style="border-radius: 16px;">
										Out of Stock
									</button>
								</th:block>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
	
</body>
</html>
