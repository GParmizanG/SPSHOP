<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:fragment="layout(content)">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPSHOP | Sports Nutrition Store</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
	crossorigin="anonymous">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
	integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
	
	<link rel="stylesheet" href="/css/style.css">
	
<!-- DataTables CSS -->
<link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.css">
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>	
<!-- DataTables JS -->
<script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.js"></script>	

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
	.swal2-popup.premium-toast {
		padding: 1rem 1.5rem !important;
	}
</style>
</head>
<body>
	<!-- Start navbar -->
	<nav class="navbar navbar-expand-lg navbar-dark" style="background: rgba(8, 15, 35, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 0.6rem 0; z-index: 1000;">
		<div class="container-fluid px-lg-4">
			<a class="navbar-brand ms-lg-2" href="/" style="font-weight: 800; font-size: 1.35rem; letter-spacing: 0.12em; color: #fff;"><i class="fa-solid fa-bolt" style="color: #daa520; margin-right: 6px;"></i>SPSHOP</a>
			<button class="navbar-toggler" type="button"
				data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
				aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0">
					<li class="nav-item ms-lg-4"><a class="nav-link active fw-medium px-3"
						aria-current="page" href="/"><i class="fa-solid fa-house me-1"></i> Home</a></li>
					
					<li class="nav-item"><a class="nav-link active fw-medium px-3"
							aria-current="page" href="/products"><i class="fa-solid fa-box-open me-1"></i> Products</a></li>
					
					<li class="nav-item dropdown">
						<a class="nav-link active dropdown-toggle fw-medium px-3" href="#" role="button"
							data-bs-toggle="dropdown" aria-expanded="false">
							<i class="fa-solid fa-list me-1"></i> Category 
						</a>
						<ul class="dropdown-menu border-0 shadow-lg mt-3" style="z-index: 2000; background: #0f172a; border-radius: 16px;">
							<li th:each="cat: ${allActiveCategory}">
								<a class="dropdown-item py-2 px-4 text-white" th:href="@{'/products?category='+${cat.categoryName}}" style="transition: all 0.2s;">
									<i class="fa-solid fa-tag me-2" style="font-size: 0.8rem; color: #daa520;"></i>[[${cat.categoryName}]]
								</a>
							</li>
						</ul>
					</li>
				</ul>
				
				<ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center me-lg-2">
					<th:block th:if="${currentLoggedInUserDetails == null}">
						<li class="nav-item"><a class="nav-link active px-3 fw-bold" href="/signin" style="color: #daa520;"><i class="fa-solid fa-right-to-bracket me-1"></i> LOGIN</a></li>
						<li class="nav-item"><a class="btn btn-sm px-4 ms-lg-2" href="/register" style="background: #daa520; color: #000; font-weight: 700; border-radius: 12px;">REGISTER</a></li>
					</th:block>

					<th:block th:if="${currentLoggedInUserDetails != null}">
						<li class="nav-item me-4" th:if="${currentLoggedInUserDetails.role == 'ROLE_USER'}">
							<a class="nav-link active position-relative" href="/user/cart" style="background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px 15px !important;">
								<i class="fas fa-cart-shopping me-1" style="color: #daa520;"></i> 
								<span class="badge rounded-pill bg-danger" id="cart-count" style="font-size: 0.65rem; position: absolute; top: -5px; right: -5px;" th:text="${countCartForUser}">0</span>
							</a>
						</li>
						<li class="nav-item dropdown">
							<a class="nav-link active dropdown-toggle fw-bold d-flex align-items-center" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"> 
								<div class="user-avatar me-2" style="width: 32px; height: 32px; background: #daa520; color: #000; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem;">
									<span th:text="${currentLoggedInUserDetails != null && currentLoggedInUserDetails.name != null && !currentLoggedInUserDetails.name.isEmpty() ? #strings.substring(currentLoggedInUserDetails.name, 0, 1).toUpperCase() : '?'}"></span>
								</div>
								<span th:text="${currentLoggedInUserDetails?.name}">User</span>
							</a>
							<ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg mt-3" style="min-width: 200px; z-index: 2000; background: #0f172a; border-radius: 16px;">
								<li th:if="${currentLoggedInUserDetails.role == 'ROLE_ADMIN'}">
									<a class="dropdown-item py-2 px-4 text-white" href="/admin/">
										<i class="fa-solid fa-gauge-high me-2" style="color: #daa520;"></i> Dashboard
									</a>
								</li>
								<li>
									<a class="dropdown-item py-2 px-4 text-white" href="/user/">
										<i class="fa-solid fa-user-circle me-2" style="color: #daa520;"></i> Profile
									</a>
								</li>
								<li><hr class="dropdown-divider" style="border-color: rgba(255,255,255,0.1);"></li>
								<li>
									<a class="dropdown-item py-2 px-4 text-danger" href="/logout">
										<i class="fa-solid fa-power-off me-2"></i> Logout
									</a>
								</li>
							</ul>
						</li>
					</th:block>
				</ul>
			</div>
		</div>
	</nav>

	<main style="flex: 1 0 auto;">
		<div th:replace="${content}"></div>
	</main>

	<!-- start footer -->
	<div style="border-top: 1px solid rgba(255,255,255,0.06); background: rgba(6, 12, 28, 0.95); padding: 2.5rem 0 1.5rem 0; width: 100%;">
		<div class="container text-center">
			<p style="font-weight: 800; font-size: 1.4rem; letter-spacing: 0.14em; color: #fff; margin-bottom: 0.4rem;"><i class="fa-solid fa-bolt" style="color: #daa520; margin-right: 6px;"></i>SPSHOP</p>
			<p style="color: rgba(255,255,255,0.35); font-size: 0.8rem; margin-bottom: 0;">Copyright &copy; 2025 SPSHOP. All rights reserved.</p>
		</div>
	</div>

	<!-- Global Scripts -->
	<script th:inline="javascript">
		const Toast = Swal.mixin({
			toast: true,
			position: 'top',
			showConfirmButton: false,
			timer: 3000,
			timerProgressBar: true,
			background: '#0a1226',
			color: '#fff',
			customClass: {
				popup: 'premium-toast',
				container: 'swal-top-index'
			}
		});

		function addToCartAjax(productId) {
			$.ajax({
				url: '/api/cart/add?productId=' + productId,
				type: 'GET',
				success: function(response) {
					if (response.status === 'success') {
						const badge = document.getElementById('cart-count');
						if (badge) badge.innerText = response.cartCount;
						Toast.fire({ icon: 'success', title: response.message });
					}
				},
				error: function(err) {
					let msg = err.responseJSON ? err.responseJSON.message : "Could not add to cart";
					Toast.fire({ icon: 'error', title: msg });
				}
			});
		}

		$(document).ready(function() {
			// Get messages from session safely
			const successMsg = /*[[${session.successMsg}]]*/ null;
			const errorMsg = /*[[${session.errorMsg}]]*/ null;
			
			if (successMsg) Toast.fire({ icon: 'success', title: successMsg });
			if (errorMsg) Toast.fire({ icon: 'error', title: errorMsg });

			$(document).on('click', '.add-to-cart-btn', function(e) {
				e.preventDefault();
				addToCartAjax($(this).data('id'));
			});

			// Reveal on scroll observer
			const revealObserver = new IntersectionObserver((entries) => {
				entries.forEach(entry => {
					if (entry.isIntersecting) {
						entry.target.classList.add('active');
					}
				});
			}, { threshold: 0.1 });

			document.querySelectorAll('.reveal-on-scroll').forEach(el => revealObserver.observe(el));
		});
	</script>
	<th:block th:if="${@commonServiceImpl.removeSessionMessage()}"></th:block>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
