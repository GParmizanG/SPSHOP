<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E Test Video Recordings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0a1226;
            color: #fff;
            font-family: 'Inter', sans-serif;
            padding-top: 3rem;
        }
        .video-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }
        .header-title {
            color: #daa520;
            font-weight: 700;
            text-align: center;
            margin-bottom: 3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="header-title">E2E Test Recordings</h1>
        
        <div th:if="${videos.empty}" class="alert alert-warning text-center" style="background: rgba(218, 165, 32, 0.1); border-color: #daa520; color: #daa520;">
            No videos found! Please run the E2E tests first using <code>mvn test -Dtest=EcommerceE2eTest</code>
        </div>
        
        <div class="row">
            <div class="col-md-6" th:each="video : ${videos}">
                <div class="video-card">
                    <h5 class="mb-3" style="color: rgba(255,255,255,0.8);" th:text="${video}"></h5>
                    <video controls>
                        <source th:src="@{'/videos/' + ${video}}" type="video/webm">
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
