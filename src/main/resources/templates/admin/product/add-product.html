<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Add Product — SPSHOP</title>
</head>
<body>
<section>
	<div class="container py-5">
		<div class="row justify-content-center">
			<div class="col-lg-7">
				<div class="glass-card p-4 p-md-5">
					<h2 class="text-center mb-4 fw-bold text-white">
						<i class="fa-solid fa-plus-circle me-2" style="color:#daa520;"></i> Add New Product
					</h2>
					

					<form action="/admin/save-product" method="post" enctype="multipart/form-data" class="mt-4">
						<div class="mb-4">
							<label class="form-label text-white-50 small fw-bold text-uppercase">Product Title</label>
							<input type="text" name="productTitle" class="form-control form-control-dark" placeholder="e.g. Creatine 100% Pure" required>
						</div>
						
						<div class="mb-4">
							<label class="form-label text-white-50 small fw-bold text-uppercase">Description</label>
							<textarea rows="3" name="productDescription" class="form-control form-control-dark" placeholder="Enter detailed product description..." required></textarea>
						</div>

						<div class="row">
							<div class="col-md-6 mb-4">
								<label class="form-label text-white-50 small fw-bold text-uppercase">Category</label>
								<select class="form-select form-select-dark" name="productCategory" required>
									<option value="" hidden>Choose category...</option>
									<option th:each="category :${allCategoryList}">[[${category.categoryName}]]</option>
								</select>
							</div>
							<div class="col-md-6 mb-4">
								<label class="form-label text-white-50 small fw-bold text-uppercase">Price (&euro;)</label>
								<input type="number" step="0.01" name="productPrice" class="form-control form-control-dark" placeholder="0.00" required>
							</div>
						</div>

						<div class="row">
							<div class="col-md-6 mb-4">
								<label class="form-label text-white-50 small fw-bold text-uppercase">Stock Quantity</label>
								<input type="number" name="productStock" class="form-control form-control-dark" placeholder="0" required>
							</div>
							<div class="col-md-6 mb-4">
								<label class="form-label text-white-50 small fw-bold text-uppercase">Product Image</label>
								<input type="file" name="file" class="form-control form-control-dark" required>
							</div>
						</div>

						<div class="mb-4">
							<label class="form-label text-white-50 small fw-bold text-uppercase d-block">Status</label>
							<div class="d-flex gap-4 mt-2">
								<div class="form-check custom-radio">
									<input class="form-check-input" type="radio" name="isActive" id="active" value="true" checked>
									<label class="form-check-label text-white" for="active">Active</label>
								</div>
								<div class="form-check custom-radio">
									<input class="form-check-input" type="radio" name="isActive" id="inactive" value="false">
									<label class="form-check-label text-white" for="inactive">Inactive</label>
								</div>
							</div>
						</div>

						<button type="submit" class="btn btn-premium w-100 py-3 mt-3">
							<i class="fa-solid fa-cloud-arrow-up me-2"></i> Save Product
						</button>	
					</form> 
				</div>
			</div>
		</div>
	</div>
	
	<style>
		.form-control-dark, .form-select-dark {
			background: rgba(255, 255, 255, 0.05) !important;
			border: 1px solid rgba(255, 255, 255, 0.1) !important;
			border-radius: 12px !important;
			color: #fff !important;
			padding: 0.75rem 1rem;
			transition: all 0.3s ease;
		}
		
		.form-control-dark:focus, .form-select-dark:focus {
			background: rgba(255, 255, 255, 0.08) !important;
			border-color: #daa520 !important;
			box-shadow: 0 0 0 4px rgba(218, 165, 32, 0.1) !important;
		}
		
		.form-control-dark::placeholder {
			color: rgba(255, 255, 255, 0.25);
		}
		
		.custom-radio .form-check-input {
			background-color: rgba(255, 255, 255, 0.1);
			border-color: rgba(255, 255, 255, 0.2);
		}
		
		.custom-radio .form-check-input:checked {
			background-color: #daa520;
			border-color: #daa520;
		}
	</style>
</section>
</body>
</html>
