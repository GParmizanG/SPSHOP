<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Category</title>
</head>
<body>
	<section>
		<div class="container py-5">
			<div class="row justify-content-center">
				<div class="col-md-6 col-lg-5">
					<div class="glass-card p-4 p-md-5">
						<h2 class="text-center mb-4 fw-bold text-white">
							<i class="fa-solid fa-pen-to-square me-2" style="color:#daa520;"></i> Edit Category
						</h2>
						
						<!-- Messages -->

						<form action="/admin/update-category" method="post" enctype="multipart/form-data" class="mt-4">
							<input type="hidden" name="id" th:value="${category.id}">
							
							<div class="mb-4">
								<label class="form-label text-white-50 small fw-bold text-uppercase">Category Name</label>
								<input type="text" name="categoryName" class="form-control form-control-dark" th:value="${category.categoryName}" required>
							</div>

							<div class="mb-4">
								<label class="form-label text-white-50 small fw-bold text-uppercase d-block">Status</label>
								<div class="d-flex gap-4 mt-2">
									<div class="form-check custom-radio">
										<input class="form-check-input" type="radio" name="isActive" id="active" value="true" th:checked="${category.isActive}">
										<label class="form-check-label text-white" for="active">Active</label>
									</div>
									<div class="form-check custom-radio">
										<input class="form-check-input" type="radio" name="isActive" id="inactive" value="false" th:checked="${!category.isActive}">
										<label class="form-check-label text-white" for="inactive">Inactive</label>
									</div>
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label text-white-50 small fw-bold text-uppercase">Update Image (Optional)</label>
								<input type="file" name="file" class="form-control form-control-dark">
								<div class="mt-3 text-center">
									<p class="text-white-50 small mb-2">Current Image:</p>
									<img th:src="@{'/img/category/'+${category.categoryImage}}" class="rounded-3 shadow" style="width: 100px; height: 100px; object-fit: cover; border: 2px solid rgba(255,255,255,0.1);">
								</div>
							</div>

							<button type="submit" class="btn btn-premium w-100 py-3 mt-3">
								<i class="fa-solid fa-rotate me-2"></i> Update Category
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>

		<style>
			.form-control-dark {
				background: rgba(255, 255, 255, 0.05) !important;
				border: 1px solid rgba(255, 255, 255, 0.1) !important;
				border-radius: 12px !important;
				color: #fff !important;
				padding: 0.75rem 1rem;
				transition: all 0.3s ease;
			}
			.form-control-dark:focus {
				background: rgba(255, 255, 255, 0.08) !important;
				border-color: #daa520 !important;
				box-shadow: 0 0 0 4px rgba(218, 165, 32, 0.1) !important;
			}
			.custom-radio .form-check-input {
				background-color: rgba(255, 255, 255, 0.1);
				border-color: rgba(255, 255, 255, 0.2);
			}
			.custom-radio .form-check-input:checked {
				background-color: #daa520;
				border-color: #daa520;
			}
		</style>
	</section>
</body>
</html>
