<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Reset Password | SPSHOP</title>
</head>
<body>
	<section>
		<div class="container py-5 mt-5">
			<div class="row justify-content-center align-items-center gx-5">
				<div class="col-lg-5">
					<div class="card register-image-card overflow-hidden shadow-lg border-0" style="border-radius: 24px;">
						<img alt="Reset password image" src="/img/login.jpg" class="img-fluid w-100" style="height: 450px; object-fit: cover;">
					</div>
				</div>

				<div class="col-lg-6">
					<div class="glass-card p-4 p-md-5">
						<h2 class="text-center mb-4 fw-bold text-white">
							<i class="fa-solid fa-lock-open me-2" style="color:#daa520;"></i> Reset Password
						</h2>


						<form action="/reset-password" method="post" id="resetPasswordForm">
							<div class="mb-4">
								<label class="form-label text-white-50 small fw-bold text-uppercase">New Password</label>
								<div class="input-group">
									<span class="input-group-text bg-transparent border-end-0" style="border: 1px solid rgba(255,255,255,0.1); border-radius: 12px 0 0 12px; color: rgba(255,255,255,0.4);">
										<i class="fa-solid fa-key"></i>
									</span>
									<input class="form-control" id="password" name="password" type="password" required 
										   style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-left: none; border-radius: 0; color: #fff; padding: 12px;">
									<button class="btn btn-outline-secondary" type="button" onclick="togglePassword('password', this)" style="border-color: rgba(255,255,255,0.1); border-radius: 0 12px 12px 0; color: rgba(255,255,255,0.5);">
										<i class="fa-solid fa-eye"></i>
									</button>
								</div>
								<small class="text-white-50 mt-1 d-block" style="font-size: 0.75rem;">Min 8 characters & at least 1 special character</small>
							</div>
							
							<div class="mb-4">
								<label class="form-label text-white-50 small fw-bold text-uppercase">Confirm Password</label>
								<div class="input-group">
									<span class="input-group-text bg-transparent border-end-0" style="border: 1px solid rgba(255,255,255,0.1); border-radius: 12px 0 0 12px; color: rgba(255,255,255,0.4);">
										<i class="fa-solid fa-check-double"></i>
									</span>
									<input class="form-control" id="confirmPassword" type="password" name="confirmPassword" required 
										   style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-left: none; border-radius: 0; color: #fff; padding: 12px;">
									<button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirmPassword', this)" style="border-color: rgba(255,255,255,0.1); border-radius: 0 12px 12px 0; color: rgba(255,255,255,0.5);">
										<i class="fa-solid fa-eye"></i>
									</button>
								</div>
								<span id="passwordError" class="small mt-1 d-block"></span>
							</div>

							<input type="hidden" th:value="${token}" name="token">
							
							<button type="submit" class="btn btn-premium w-100 py-3 mt-2" id="submitButton" disabled>
								Update Password
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
		
		<script>
			$(document).ready(function(){
				 $('#password, #confirmPassword').on('input', function() {
				        const password = $('#password').val();
				        const confirmPassword = $('#confirmPassword').val();
				        
				        if (password === confirmPassword && password !== "") {
				            $('#submitButton').prop('disabled', false);
				            $('#passwordError').text('Passwords match').css('color', '#2ecc71');
				        } else {
				            $('#submitButton').prop('disabled', true);
				            if(confirmPassword !== "") {
				                $('#passwordError').text('Passwords do not match').css('color', '#e74c3c');
				            } else {
				                $('#passwordError').text('');
				            }
				        }
				 });
			});

			function togglePassword(id, btn) {
				const input = document.getElementById(id);
				const icon = btn.querySelector('i');
				if (input.type === 'password') {
					input.type = 'text';
					icon.classList.replace('fa-eye', 'fa-eye-slash');
				} else {
					input.type = 'password';
					icon.classList.replace('fa-eye-slash', 'fa-eye');
				}
			}
		</script>
	</section>
</body>
</html>
