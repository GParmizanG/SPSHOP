<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>SPSHOP | Login</title>
</head>
<body>
	<section>
		<div class="container mt-5 mb-5">
			<div class="row justify-content-center">
				<div class="col-md-5">
					<div class="glass-card p-5 shadow-lg border-0" style="border-radius: 30px; background: rgba(10, 20, 40, 0.7) !important;">
						<div class="text-center mb-4">
							<div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px; background: rgba(218, 165, 32, 0.1); border-radius: 20px;">
								<i class="fa-solid fa-user-lock" style="font-size: 2rem; color: #daa520;"></i>
							</div>
							<h3 class="fw-bold text-white mb-1" style="letter-spacing: -0.02em;">Welcome Back</h3>
							<p class="text-white-50 small">Sign in to your account to continue</p>
						</div>

						<!-- Alerts from Session -->
						<th:block th:if="${param.error}">
							<div class="alert alert-danger border-0 small py-2 mb-4 text-center" style="border-radius: 12px; background: rgba(220, 53, 69, 0.1); color: #ff6b6b;">
								<span th:if="${session['SPRING_SECURITY_LAST_EXCEPTION'] != null}" th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message}">Incorrect credentials</span>
								<span th:if="${session['SPRING_SECURITY_LAST_EXCEPTION'] == null}">Invalid login attempt</span>
							</div>
						</th:block>
						<th:block th:if="${param.logout}">
							<div class="alert alert-success border-0 small py-2 mb-4 text-center" style="border-radius: 12px; background: rgba(40, 167, 69, 0.1); color: #51cf66;">
								You have been logged out.
							</div>
						</th:block>

						<form action="/login" method="post">
							<div class="mb-4">
								<label class="form-label text-white-50 small fw-bold ps-2">Email Address</label>
								<div class="input-group">
									<span class="input-group-text border-0" style="background: rgba(255,255,255,0.05); border-radius: 16px 0 0 16px; color: #daa520;">
										<i class="fa-solid fa-envelope"></i>
									</span>
									<input type="email" name="username" class="form-control border-0 py-3" placeholder="name@example.com" required 
										style="background: rgba(255,255,255,0.05); color: #fff; border-radius: 0 16px 16px 0;">
								</div>
							</div>

							<div class="mb-4">
								<div class="mb-2">
									<label class="form-label text-white-50 small fw-bold ps-2 mb-0">Password</label>
								</div>
								<div class="input-group">
									<span class="input-group-text border-0" style="background: rgba(255,255,255,0.05); border-radius: 16px 0 0 16px; color: #daa520;">
										<i class="fa-solid fa-key"></i>
									</span>
									<input type="password" name="password" id="password" class="form-control border-0 py-3" placeholder="••••••••" required 
										style="background: rgba(255,255,255,0.05); color: #fff; border-radius: 0; border-right: none;">
									<span class="input-group-text border-0" style="background: rgba(255,255,255,0.05); border-radius: 0 16px 16px 0; color: #daa520; cursor: pointer;" onclick="togglePassword('password', this)">
										<i class="fa-solid fa-eye"></i>
									</span>
								</div>
							</div>

							<button type="submit" class="btn w-100 py-3 fw-bold mt-2 shadow-sm" 
								style="background: #daa520; color: #000; border-radius: 16px; transition: all 0.3s ease;">
								Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-2"></i>
							</button>

							<div class="text-center mt-5">
								<p class="text-white-50 small mb-1">Don't have an account? 
									<a href="/register" class="text-decoration-none ms-1" style="color: #daa520; font-weight: 700;">Join Now</a>
								</p>
								<p class="text-white-50 small mb-0">Forgot Password? 
									<a href="/forgot-password" class="text-decoration-none ms-1" style="color: #daa520; font-weight: 700;">Recover</a>
								</p>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
		
		<script>
			function togglePassword(inputId, iconEl) {
				const input = document.getElementById(inputId);
				const icon = iconEl.querySelector('i');
				if (input.type === 'password') {
					input.type = 'text';
					icon.classList.remove('fa-eye');
					icon.classList.add('fa-eye-slash');
				} else {
					input.type = 'password';
					icon.classList.remove('fa-eye-slash');
					icon.classList.add('fa-eye');
				}
			}
		</script>
		
		<style>
			input::placeholder {
				color: rgba(255,255,255,0.2) !important;
			}
			.form-control:focus {
				background: rgba(255,255,255,0.08) !important;
				color: #fff !important;
				box-shadow: 0 0 0 2px rgba(218, 165, 32, 0.2) !important;
			}
			.btn:hover {
				background: #fff !important;
				color: #daa520 !important;
				transform: translateY(-2px);
				box-shadow: 0 8px 25px rgba(218, 165, 32, 0.4) !important;
			}
		</style>
	</section>
</body>
</html>
